name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, Shaheer]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # ruff is pinned: an unpinned lint tool means the build can break on a
      # day nobody touched the code.
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install "ruff==0.16.2" "pytest==9.1.1" "pytest-asyncio==1.4.0"

      # Rule selection lives in ruff.toml, not in flags. CI used to run bare
      # `ruff check --ignore E501,F401` with an unpinned ruff, whose default
      # rule set has broadened across releases — the same command went from
      # passing to 262 findings without a line of app code changing.
      - name: Lint with ruff
        run: ruff check app/ tests/ scripts/

      # The previous version of this step ended in `and False`, so the error
      # list was always empty and no file was ever parsed — it printed a count
      # and passed unconditionally (AUDIT.md L1). This one actually compiles
      # every module and fails on a syntax error.
      - name: Compile all modules
        run: python -m compileall -q app/

      # Catches broken imports, bad decorators and router wiring that
      # compileall cannot see. Uses placeholder secrets: the app validates
      # required env vars at startup and we want that path exercised too.
      - name: Verify app imports
        env:
          APP_ENV: development
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_KEY: placeholder
          SUPABASE_ANON_KEY: placeholder
          LLM_API_KEY: placeholder
        run: python -c "import app.main; print('app.main imported OK')"

      # Output is teed into the job summary because workflow *logs* need admin
      # rights to read, while the summary is public — so a failure here is
      # diagnosable from the API without repo admin.
      - name: Run tests
        env:
          APP_ENV: development
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_KEY: placeholder
          SUPABASE_ANON_KEY: placeholder
          LLM_API_KEY: placeholder
          APP_SECRET_KEY: test-secret-not-a-real-key
        run: |
          set +e
          pytest -rA --tb=long > pytest-output.txt 2>&1
          code=$?
          cat pytest-output.txt
          {
            echo "### pytest (exit $code)"
            echo ''
            echo '```'
            tail -c 60000 pytest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $code -ne 0 ]; then
            # One annotation per line: annotations are readable from the public
            # API, while workflow logs require repository admin rights. Per-line
            # avoids escaping newlines, which broke this file once already.
            tail -n 40 pytest-output.txt | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $code
