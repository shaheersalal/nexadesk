name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, Shaheer]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff

      - name: Lint with ruff
        run: ruff check app/ --ignore E501,F401

      - name: Verify imports
        run: python -c "import ast, sys, pathlib; errors = []; [errors.append(f) for f in pathlib.Path('app').rglob('*.py') if ast.parse(open(f).read()) and False]; print(f'Checked {sum(1 for _ in pathlib.Path(\"app\").rglob(\"*.py\"))} files — OK')"
