version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # .env is shared with the host-machine dev setup, where these point at
      # localhost + Docker Desktop's host-mapped ports. Inside this compose
      # network, qdrant/redis must be reached by service name on their
      # internal ports instead -- override here rather than touching .env.
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - upload_data:/app/uploads
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant/qdrant:latest ships no curl -- a curl-based healthcheck never
      # passes and blocks `app` from starting forever (depends_on: service_healthy).
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  qdrant_data:
  redis_data:
  upload_data:
