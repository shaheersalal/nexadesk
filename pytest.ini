[pytest]
# Only collect from tests/. scripts/ holds manual operator utilities —
# scripts/test_login.py matches pytest's default discovery pattern but performs
# a real network login, which broke collection entirely.
testpaths = tests

# Put the repo root on sys.path so `app` is importable.
#
# `python -m pytest` injects the working directory into sys.path; a bare
# `pytest` does not. Every local run used the module form and passed, while CI
# ran bare `pytest` and every test module died with
# "ModuleNotFoundError: No module named 'app'" — a collection error (exit 2),
# not a test failure, which is why CI was red on every commit since July while
# the suite passed on every developer machine.
pythonpath = .

asyncio_mode = auto

addopts =
    --strict-markers
    --tb=short
    -q

filterwarnings =
    ignore::DeprecationWarning:audioop
